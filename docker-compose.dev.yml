x-eureka-env: &eureka-env
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

x-rabbit-env: &rabbit-env
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

x-redis-env: &redis-env
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}

x-pg-env: &pg-env
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

x-jwt-env: &jwt-env
  JWT_SECRET: ${JWT_SECRET}
  JWT_EXPIRY_MS: ${JWT_EXPIRY_MS}
  JWT_REFRESH_EXPIRY_MS: ${JWT_REFRESH_EXPIRY_MS}

services:

  postgres:
    image: postgres:16
    container_name: parkease-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-init:
    image: postgres:16
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./scripts/init-db.sql:/scripts/init-db.sql:ro
    command:
      - sh
      - -c
      - psql -h postgres -U $${POSTGRES_USER} -d postgres -f /scripts/init-db.sql

  redis:
    image: redis:7
    container_name: parkease-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: parkease-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"

  eureka-server:
    build:
      context: ./eureka-server
      args:
        - SKIP_TESTS=true
    container_name: parkease-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker

  auth-service:
    build:
      context: ./auth-service
      args:
        - SKIP_TESTS=true
    container_name: parkease-auth
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      <<: [*eureka-env, *redis-env, *pg-env, *jwt-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECTURI: http://localhost:8080/oauth2/callback/google
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      eureka-server:
        condition: service_started
    mem_limit: 320m

  parking-service:
    build:
      context: ./parking-service
      args:
        - SKIP_TESTS=true
    container_name: parkease-parking
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      <<: [*eureka-env, *redis-env, *rabbit-env, *pg-env, *jwt-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/parking_db
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    mem_limit: 320m

  booking-service:
    build:
      context: ./booking-service
      args:
        - SKIP_TESTS=true
    container_name: parkease-booking
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      <<: [*eureka-env, *redis-env, *rabbit-env, *pg-env, *jwt-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking_db
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    mem_limit: 320m

  payment-service:
    build:
      context: ./payment-service
      args:
        - SKIP_TESTS=true
    container_name: parkease-payment
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      <<: [*eureka-env, *rabbit-env, *pg-env, *jwt-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    mem_limit: 256m

  notification-service:
    build:
      context: ./notification-service
      args:
        - SKIP_TESTS=true
    container_name: parkease-notification
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      <<: [*eureka-env, *rabbit-env, *pg-env, *jwt-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_ENABLED: "true"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    mem_limit: 224m

  analytics-service:
    build:
      context: ./analytics-service
      args:
        - SKIP_TESTS=true
    container_name: parkease-analytics
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      <<: [*eureka-env, *rabbit-env, *pg-env, *jwt-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/analytics_db
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    mem_limit: 224m

  api-gateway:
    build:
      context: ./api-gateway
      args:
        - SKIP_TESTS=true
    container_name: parkease-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: [*eureka-env, *jwt-env]
      SPRING_CLOUD_LOADBALANCER_CACHE_TTL: 5s
    depends_on:
      - eureka-server
    mem_limit: 256m

volumes:
  postgres_data:
